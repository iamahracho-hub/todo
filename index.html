<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>To-Do List</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1>To-Do List</h1>
      <input type="text" id="search-input" placeholder="검색 (제목 또는 태그)">
    </header>

    <form id="todo-form" class="todo-form">
      <input type="text" id="title-input" placeholder="할 일을 입력하세요" required>
      <input type="text" id="category-input" placeholder="카테고리 (예: 업무, 개인)">
      <select id="priority-input">
        <option value="high">높음</option>
        <option value="medium" selected>중간</option>
        <option value="low">낮음</option>
      </select>
      <input type="date" id="due-date-input">
      <button type="submit">추가</button>
    </form>

    <div class="controls">
      <div class="filters">
        <button class="filter-btn active" data-filter="all">전체</button>
        <button class="filter-btn" data-filter="active">미완료</button>
        <button class="filter-btn" data-filter="completed">완료</button>
      </div>
      <select id="sort-select">
        <option value="createdAt">생성순</option>
        <option value="dueDate">마감일순</option>
        <option value="priority">우선순위순</option>
      </select>
    </div>

    <ul id="todo-list" class="todo-list"></ul>

    <p id="empty-state" class="empty-state" hidden>할 일이 없습니다.</p>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
